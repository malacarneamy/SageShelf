<!DOCTYPE html>
<html lang="it" class="profile-page-html">
<head>
    <script>
        const t = localStorage.getItem('sageshelf-theme');
        if (t === 'night') document.documentElement.setAttribute('data-theme', 'night');
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo — SageShelf</title>
  <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/books.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="profile-page-body">

<nav class="navbar">
  <a class="navbar-brand" href="/">
    <img src="assets/img/logo.jpg" alt="Logo" class="nav-logo"> SageShelf
  </a>
  <div class="navbar-actions">
    <button id="btn-theme" title="Cambia tema" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;">
        <img src="assets/icon/tema.png" alt="Tema" style="width:36px;height:36px;object-fit:contain;">
    </button>
    <div class="nav-profile" id="nav-username" title="Profilo">👤</div>
    <button id="btn-logout" class="btn-nav-ghost">Esci</button>
  </div>
</nav>

<div class="ptr-indicator" id="ptr-indicator">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
</div>
<main class="main-content">
    <div class="profile-page">
    <img src="assets/img/profilo.png" alt="Profilo" class="header-logo">

    <!-- Avatar centrato sopra la card -->
    <div class="profile-avatar-section">
        <div class="profile-avatar-wrap">
        <img id="profile-avatar-img" class="profile-avatar-img hidden" src="" alt="Avatar">
        <div id="profile-avatar-placeholder" class="profile-avatar-placeholder">👤</div>
        <button id="profile-remove-avatar" class="profile-avatar-remove" style="display:none" title="Rimuovi immagine">×</button>
        <label class="profile-avatar-overlay" title="Cambia immagine">
            📷
            <input type="file" id="profile-avatar-input" accept="image/jpeg,image/png,image/webp" style="display:none">
        </label>
        </div>
    </div>
    <p class="profile-version">made by Godzillalilla · version: 1.0.12</p>

    <!-- Card unica -->
    <div class="profile-card">

        <!-- Username -->
        <div class="profile-field">
        <label class="profile-field-label">Username</label>
        <div class="profile-field-row">
            <input type="text" id="profile-username" class="profile-field-input" placeholder="Il tuo nome" readonly>
            <button id="profile-edit-username-btn" class="btn-cancel profile-field-btn">Cambia</button>
        </div>

        <!-- Riga di modifica (nascosta di default) -->
        <div id="profile-username-new-wrap" class="profile-field-row hidden" style="margin-top:.6rem">
            <input type="text" id="profile-username-new" class="profile-field-input" placeholder="Nuovo username">
            <button id="profile-save-username" class="btn-confirm profile-field-btn">Salva</button>
            <button id="profile-username-cancel" class="btn-cancel profile-field-btn">Annulla</button>
        </div>
        </div>

        <hr class="profile-divider">

        <div class="profile-field">
        <label class="profile-field-label">Email</label>
        <div class="profile-field-row">
            <input type="email" id="profile-email" class="profile-field-input" readonly>
            <button id="profile-edit-email-btn" class="btn-cancel profile-field-btn">Cambia</button>
        </div>

        <!-- Step 1: inserimento nuova email -->
        <div id="profile-email-new-wrap" class="profile-field-row hidden" style="margin-top:.6rem">
            <input type="email" id="profile-email-new" class="profile-field-input" placeholder="Nuova email">
            <button id="profile-email-send-code" class="btn-confirm profile-field-btn">Invia codice</button>
            <button id="profile-email-cancel" class="btn-cancel profile-field-btn">Annulla</button>
        </div>

        <!-- Step 2: verifica codice ricevuto sulla nuova email -->
        <div id="profile-email-code-wrap" class="profile-field-row hidden" style="margin-top:.6rem">
            <p class="auth-code-hint" style="width:100%">Codice inviato a <strong id="profile-email-code-sent-to"></strong></p>
            <input type="text" id="profile-email-code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                   class="profile-field-input" placeholder="123456">
            <button id="profile-email-confirm-code" class="btn-confirm profile-field-btn">Conferma</button>
            <button id="profile-email-cancel-code" class="btn-cancel profile-field-btn">Annulla</button>
        </div>
        </div>

        <hr class="profile-divider">

        <!-- Azioni -->
        <div class="profile-actions">
        <button id="profile-delete-account-btn" class="btn-danger-sm">🗑 Elimina account</button>
        </div>

    </div>

    <!-- Pannello elimina account (nascosto di default) -->
    <div id="profile-delete-panel" class="profile-card hidden" style="border-color: var(--red)">
        <h2 class="profile-card-title">🗑 Elimina account</h2>
        <p class="profile-danger-text">Questa azione è irreversibile. Tutti i tuoi libri, scaffali e recensioni verranno eliminati.</p>
        <div class="profile-actions">
        <button id="profile-cancel-delete" class="btn-cancel">Annulla</button>
        <button id="profile-delete-account" class="btn-danger-sm">Elimina definitivamente</button>
        </div>
    </div>

    </div>
</main>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav" id="bottom-nav">
  <a href="/" class="bottom-nav-item">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Collezione</span>
  </a>
  <span class="bottom-nav-item bottom-nav-item--profile active" title="Profilo">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Profilo</span>
  </span>
  <button class="bottom-nav-item" id="bnav-logout-mobile">
    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    <span>Esci</span>
  </button>
</nav>

<div id="toast" class="toast"></div>

<script src="js/models/BaseModel.js"></script>
<script src="js/models/ApiModel.js"></script>
<script src="js/presenters/BasePresenter.js"></script>
<script src="js/presenters/AuthPresenter.js"></script>
<script src="js/views/BaseView.js"></script>
<script src="js/views/ProfileView.js"></script>
<script src="js/utils/PullToRefresh.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    new ProfileView().init();
    new PullToRefresh({
      container: document.querySelector('.main-content'),
      indicator: document.getElementById('ptr-indicator'),
      onRefresh: () => location.reload(),
    });
  });
  document.getElementById('bnav-logout-mobile')?.addEventListener('click', async () => {
    await api.logout();
    window.location.href = '/';
  });
</script>
</body>
</html>
